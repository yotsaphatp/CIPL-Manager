<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CIPL Link</title>
<style>
:root{--bg:#f3f1ec;--sf:#fff;--tx:#1b2430;--mu:#6a7380;--ac:#0d5c63;--ac2:#e8f1f1;--wn:#b4531a;--wb:#fbeadd;--bd:#d9d6cd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141a20;--sf:#1e262e;--tx:#e8ecef;--mu:#93a0ad;--ac:#5cc0c8;--ac2:#1d3338;--wn:#f0a26b;--wb:#3a2a1d;--bd:#34404b}}
:root[data-theme=dark]{--bg:#141a20;--sf:#1e262e;--tx:#e8ecef;--mu:#93a0ad;--ac:#5cc0c8;--ac2:#1d3338;--wn:#f0a26b;--wb:#3a2a1d;--bd:#34404b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:12px 14px 90px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px 2px;font:inherit;font-size:12px}
nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 2px var(--ac)}
nav b{display:block;font-size:18px}
h1{font-size:19px;margin:6px 0 2px}h2{font-size:16px;margin:16px 0 6px}
.mu{color:var(--mu);font-size:13px}
.c{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:8px 0}
input,textarea,select{width:100%;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx)}
input.ed{border-color:var(--wn);background:var(--wb)}
button.p,button.s{font:inherit;border-radius:8px;padding:9px 14px;border:1px solid var(--ac);cursor:pointer}
button.p{background:var(--ac);color:var(--bg);font-weight:600}button.s{background:none;color:var(--ac)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.g button{padding:10px 2px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);font:inherit;font-size:13px}
.g button.h{border-color:var(--ac);background:var(--ac2);font-weight:700}
.g button.cur{background:var(--ac);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--bd);border-radius:99px;background:var(--sf);color:var(--tx);padding:5px 10px;font:inherit;font-size:12px}
.r{display:flex;gap:8px;align-items:center}.r>*{flex:1}.r>.f{flex:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wn{background:var(--wb);color:var(--wn);border-radius:8px;padding:6px 10px;margin:4px 0;font-size:13px}
.ok{color:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid var(--bd);padding:4px 6px;text-align:left;vertical-align:top}
.sc{overflow-x:auto}
.t{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ac);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;z-index:9}
label{font-size:12px;color:var(--mu)}

function addEx(b){const d=document.getElementById("xd"+b).value.trim(),q=+document.getElementById("xq"+b).value||1;if(!d)return;(S.ex[b]=S.ex[b]||[]).push({d,q});save();render()}
function delEx(b,k){S.ex[b].splice(k,1);save();render()}
function G(){const ids=Object.keys(S.asg);return BOXES.concat([...new Set(ids.map(i=>S.asg[i]).filter(b=>b.startsWith("SELF")))]).filter(b=>inBox(b).length||(S.ex[b]||[]).length).map(b=>{const x=S.bx[b]||{};return{type:b.startsWith("SELF")?"Case":"Box",w:x.w,wd:x.wd,l:x.l,h:x.h,L:[...inBox(b).map(i=>get(i)),...(S.ex[b]||[]).map(y=>({d:y.d,q:y.q,s:"",h:"",c:"",a:"",p:null}))]}})}
async function exportX(){try{const buf=await buildXlsx(ExcelJS,TPL,S.ship,G()),bl=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),fn="CIPL_"+S.ship.no+".xlsx",dl=window.claude?await claude.use("downloads"):null;
if(dl)await dl.save({filename:fn,data:bl});else{const a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=fn;document.body.append(a);a.click();a.remove()}}catch(x){toast(x.message||"สร้างไฟล์ไม่สำเร็จ")}}
async function photo(f,inp){if(!f)return;SM="กำลังอ่านรูป...";render();let r=null;
try{const b=await createImageBitmap(f);
if("BarcodeDetector" in window){try{const q=await new BarcodeDetector({formats:["qr_code"]}).detect(b);if(q[0])r=q[0].rawValue}catch(z){}}
const k=Math.min(1,3200/Math.max(b.width,b.height)),W=Math.round(b.width*k),H=Math.round(b.height*k),c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(b,0,0,W,H);
for(const [fw,fh] of [[1,1],[.5,.25],[.5,1/6],[.34,.12]]){if(r)break;const w=Math.round(fw*W),h=Math.round(fh*H);
for(let sy=0;sy<H&&!r;sy+=Math.max(1,Math.round(h/2)))for(let sx=0;sx<W&&!r;sx+=Math.max(1,Math.round(w/2))){const cw=Math.min(w,W-sx),ch=Math.min(h,H-sy);if(cw<80||ch<80)continue;const d=x.getImageData(sx,sy,cw,ch),q=jsQR(d.data,cw,ch);if(q)r=q.data}
await new Promise(z=>setTimeout(z,0))}
}catch(e2){SM="เปิดรูปไม่ได้: "+(e2.message||e2);render();return}
if(inp)inp.value="";
if(r){toast("อ่านได้ "+r);scan(r)}else{SM="อ่าน QR ไม่ได้ ลองถ่ายใหม่ให้เห็น QR ใบเดียวเต็มเฟรม ไม่เอียง แสงพอ หรือกดเลือกรูปที่ซูม QR ไว้";render()}}
function setSh(k,v){S.ship[k]=v;save()}
async function cam(){if(!("BarcodeDetector" in window)){toast("เบราว์เซอร์นี้ไม่รองรับกล้อง พิมพ์รหัสแทน");return}
const v=document.getElementById("v");v.style.display="block";
try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});v.srcObject=s;await v.play();
const bd=new BarcodeDetector({formats:["qr_code"]});const t=setInterval(async()=>{const r=await bd.detect(v);if(r[0]){clearInterval(t);s.getTracks().forEach(x=>x.stop());v.style.display="none";scan(r[0].rawValue)}},400)}catch(x){toast("เปิดกล้องไม่ได้");v.style.display="none"}}
function vScan(){let h="<h1>สแกนอุปกรณ์</h1><p class=mu>สแกน QR ของอุปกรณ์ แล้วเลือกกล่องที่ใส่</p>"+(SM?"<div class=wn>"+e(SM)+"</div>":"");
if(cur){const it=get(cur),a=S.asg[cur],hb=BOXES[base(cur).b-1];
h+=`<div class=c><b>${e(cur)}</b> ${e(it.d)}<div class=mu>S/N ${e(it.s)} · Asset ${e(it.a||"-")}</div>${a?`<div class=wn>อยู่ใน ${a} แล้ว เลือกใหม่เพื่อย้าย</div>`:""}</div>
<p class=mu>ใส่กล่องไหน (กล่องประจำ: ${hb}) แตะเลือก หรือสแกน QR กล่อง</p><div class=g>${BOXES.map(b=>`<button class="${b===hb?"h":""} ${b===a?"cur":""}" onclick="put('${b}')">${b.slice(4)}</button>`).join("")}</div>
<p><button class=s onclick="put('SELF-'+cur)">ใช้กล่องของอุปกรณ์เอง</button> <button class=s onclick="cur=null;render()">ยกเลิก</button></p>`}
else h+=`<div class=c><div class=r><input id=q placeholder="พิมพ์รหัส เช่น ITM-0005" onkeydown="event.key=='Enter'&&scan(this.value)"><button class="p f" onclick="scan(q.value)">ค้นหา</button></div><p><label style="display:inline-block;padding:9px 14px;border-radius:8px;background:var(--ac);color:var(--bg);font-weight:600">ถ่ายรูป QR<input type=file accept="image/*" capture=environment hidden onchange="photo(this.files[0],this)"></label> <label style="display:inline-block;padding:9px 14px;border-radius:8px;border:1px solid var(--ac);color:var(--ac)">เลือกรูป<input type=file accept="image/*" hidden onchange="photo(this.files[0],this)"></label> <button class=s onclick="cam()">สแกนสด (ถ้ากล้องเปิดได้)</button></p><video id=v playsinline style="display:none;width:100%;border-radius:8px"></video></div>
<h2>จำลองการสแกน</h2><div class=chips>${D.map(x=>`<button onclick="scan('${x.i}')">${x.i.slice(4)} ${e(x.d.slice(0,14))}${S.asg[x.i]?" ✓":""}</button>`).join("")}</div>
<p class=mu>แพ็คแล้ว ${Object.keys(S.asg).length}/${D.length} ชิ้น</p>`;return h}
function vBox(){const u=used();let h="<h1>กล่อง</h1><p class=mu>เพิ่มรายการเอง น้ำหนัก และขนาดของแต่ละกล่อง</p>";
if(!u.length)h+="<div class=c>ยังไม่มีของในกล่อง เริ่มที่แท็บสแกน</div>";
BOXES.concat(Object.keys(S.asg).filter(i=>S.asg[i].startsWith("SELF")).map(i=>S.asg[i])).filter((b,k,a)=>a.indexOf(b)===k&&(inBox(b).length||(S.ex[b]||[]).length)).forEach(b=>{const x=S.bx[b]||{};
h+=`<div class=c><b>${b}</b>${inBox(b).map(i=>`<div class=r><span>${get(i).d} <span class=mu>${i}</span></span><button class="s f" onclick="unput('${i}')">เอาออก</button></div>`).join("")}
${(S.ex[b]||[]).map((y,k)=>`<div class=r><span>${e(y.d)} ×${y.q} <span class=mu>(เพิ่มเอง)</span></span><button class="s f" onclick="delEx('${b}',${k})">ลบ</button></div>`).join("")}
<div class=r style="margin-top:6px"><input id=xd${b} placeholder="เพิ่มรายการ เช่น สาย LAN"><input id=xq${b} type=number value=1 style="max-width:60px"><button class="s f" onclick="addEx('${b}')">เพิ่ม</button></div>
<div class=row2 style="margin-top:8px"><div><label>น้ำหนัก kg</label><input type=number value="${x.w||""}" onchange="setBx('${b}','w',this.value)"></div><div><label>กว้าง×ยาว×สูง cm</label><div class=r><input type=number placeholder=W value="${x.wd||""}" onchange="setBx('${b}','wd',this.value)"><input type=number placeholder=L value="${x.l||""}" onchange="setBx('${b}','l',this.value)"><input type=number placeholder=H value="${x.h||""}" onchange="setBx('${b}','h',this.value)"></div></div></div></div>`});return h}
function vItem(){const ids=Object.keys(S.asg);let h="<h1>ข้อมูลอุปกรณ์</h1><p class=mu>แก้ได้เฉพาะเที่ยวนี้ ฐานข้อมูลหลักไม่เปลี่ยน ช่องสีส้มคือค่าที่แก้</p>";
if(!ids.length)h+="<div class=c>ยังไม่มีอุปกรณ์</div>";
ids.forEach(i=>{const it=get(i),o=S.ov[i]||{};h+=`<div class=c><div class=r><b>${i} · ${S.asg[i]}</b>${Object.keys(o).length?`<button class="s f" onclick="reset('${i}')">คืนค่าเดิม</button>`:""}</div><div class=row2>${Object.keys(F).map(k=>`<div style="${k==="d"?"grid-column:1/3":""}"><label>${F[k]}</label><input class="${k in o?"ed":""}" value="${e(it[k]??"")}" onchange="setOv('${i}','${k}',this.value)"></div>`).join("")}</div></div>`});return h}
function vShip(){const f=[["no","Shipment / Invoice No."],["date","วันที่เอกสาร (Date)","date"],["sail","วันที่ส่ง (Sailing Date)","date"],["fn","ชื่อผู้ส่ง (Consignor)"],["from","ที่อยู่ผู้ส่ง (บรรทัดละ 1 ข้อมูล สูงสุด 3 บรรทัด)","ta"],["tn","ชื่อผู้รับ (Consignee)"],["to","ที่อยู่ผู้รับ (สูงสุด 4 บรรทัด)","ta"],["load","Port of Loading"],["dis","Port of Discharge"],["note","หมายเหตุ (Note)","ta"]];
return"<h1>ผู้ส่ง ผู้รับ</h1>"+f.map(([k,l,t])=>`<div style="margin:8px 0"><label>${l}</label>${t==="ta"?`<textarea rows=3 onchange="setSh('${k}',this.value)">${e(S.ship[k])}</textarea>`:`<input ${t==="date"?"type=date ":""}value="${e(S.ship[k])}" onchange="setSh('${k}',this.value)">`}</div>`).join("")}
let PG=[];
function vPrice(){const ids=Object.keys(S.asg),g={};ids.forEach(i=>{const d=get(i).d;(g[d]=g[d]||[]).push(i)});PG=Object.keys(g);
let h="<h1>ราคา</h1><p class=mu>ใส่ราคาต่อชิ้น (USD) รายการชื่อเดียวกันใช้ราคาเดียวกัน ราคาที่ใส่ใช้เฉพาะเที่ยวนี้</p>";
if(!ids.length)h+="<div class=c>ยังไม่มีอุปกรณ์ เริ่มที่แท็บสแกน</div>";
let tot=0;PG.forEach((d,k)=>{const ps=[...new Set(g[d].map(i=>get(i).p))],p=ps.length===1?ps[0]:"";g[d].forEach(i=>tot+=(get(i).p||0)*get(i).q);
h+=`<div class=c><div class=r><b>${e(d)}</b><span class="mu f">${g[d].length} ชิ้น</span></div><input type=number inputmode=decimal placeholder="ราคา USD ต่อชิ้น" value="${p??""}" onchange="setPg(${k},this.value)"></div>`});
return h+`<p class=mu>มูลค่ารวมตอนนี้ ${tot.toLocaleString()} USD</p>`}
function setPg(k,v){const d=PG[k],p=parseFloat(v);Object.keys(S.asg).forEach(i=>{if(get(i).d===d){S.ov[i]=S.ov[i]||{};if(isNaN(p)||p===base(i).p)delete S.ov[i].p;else S.ov[i].p=p}});save();toast("บันทึกราคาแล้ว")}
function vOut(){const W=[];const ids=Object.keys(S.asg);
if(!S.ship.tn)W.push("ยังไม่ใส่ชื่อผู้รับ");if(!S.ship.fn)W.push("ยังไม่ใส่ชื่อผู้ส่ง");if(!S.ship.sail)W.push("ยังไม่ใส่วันที่ส่ง");
ids.forEach(i=>{const it=get(i);["h","c","p","s"].forEach(k=>{if(!it[k])W.push(`${i} ${it.d.slice(0,20)}: ไม่มี ${F[k]}`)})});
used().forEach(b=>{const x=S.bx[b]||{};if(!x.w||!x.wd||!x.l||!x.h)W.push(`${b}: ยังไม่ใส่น้ำหนักหรือขนาด`)});
const bs=BOXES.concat([...new Set(ids.map(i=>S.asg[i]).filter(b=>b.startsWith("SELF")))]).filter(b=>inBox(b).length||(S.ex[b]||[]).length);
let n=0,tw=0,tv=0,rows="";
bs.forEach(b=>{const x=S.bx[b]||{},L=[...inBox(b).map(i=>get(i)),...(S.ex[b]||[]).map(y=>({d:y.d,q:y.q,s:"",h:"",c:"",p:null}))];tw+=x.w||0;
L.forEach((it,k)=>{n++;const v=(it.p||0)*it.q;tv+=v;rows+=`<tr><td>${n}</td><td>${e(it.h)}</td><td>${e(it.s)}</td><td>${e(it.d)}</td><td>${e(it.c)}</td><td>${it.q}</td>${k?"":`<td rowspan=${L.length}>1</td><td rowspan=${L.length}>${b.slice(0,4)==="SELF"?"Case":"Box"}</td><td rowspan=${L.length}>${x.w||""}</td><td rowspan=${L.length}>${x.wd||""}×${x.l||""}×${x.h||""}</td>`}<td>${it.p??""}</td><td>${v||""}</td></tr>`})});
return`<h1>สรุปและเอกสาร</h1>${W.length?W.slice(0,12).map(w=>`<div class=wn>${e(w)}</div>`).join("")+(W.length>12?`<p class=mu>และอีก ${W.length-12} รายการ</p>`:""):'<p class=ok>ครบถ้วน พร้อมออกเอกสาร</p>'}
<div class=c><b>CIPL ${e(S.ship.no)}</b> · ${e(S.ship.date)}<div class=mu>จาก ${e(S.ship.fn)}<br>ถึง ${e(S.ship.tn||"-")}<br>ส่งวันที่ ${e(S.ship.sail||"-")}<br>${e(S.ship.load)} → ${e(S.ship.dis||"-")}</div></div>
<div class=sc><table><tr><th>#<th>HS<th>S/N<th>Description<th>COO<th>Qty<th>Pk<th>Type<th>kg<th>W×L×H<th>Price<th>Value</tr>${rows||"<tr><td colspan=12>ยังไม่มีรายการ</td></tr>"}<tr><th colspan=8>Total<th>${tw.toFixed(1)}<th><th><th>${tv.toLocaleString()}</tr></table></div>
<p><button class=p style="width:100%;padding:13px" onclick="exportX()">ส่งออก CIPL (.xlsx)</button></p><p class=mu>สร้างลงใน template 26020-SUR-CPL-001 รองรับสูงสุด 59 รายการ ผู้ติดต่อ/อีเมล/โทรใช้ค่าเดิมใน template</p>`}
function render(){const T=[["scan","📷","สแกน"],["box","📦","กล่อง"],["item","📝","ข้อมูล"],["price","💲","ราคา"],["ship","🏢","ผู้ส่ง/รับ"],["out","📄","เอกสาร"]];
document.getElementById("n").innerHTML=T.map(t=>`<button class="${V===t[0]?"on":""}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join("");
document.getElementById("m").innerHTML=({scan:vScan,box:vBox,item:vItem,price:vPrice,ship:vShip,out:vOut})[V]();scrollTo(0,0)}
render();
</script></body></html>
